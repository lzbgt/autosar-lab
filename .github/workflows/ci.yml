name: Host tutorial verification
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc cmake python3
      - name: Build, unit and rootless E2E tests
        run: bash tools/run-all.sh
